#01/08/2026 (editor) — voorheen ontbrak dit bestand: het project had geen
#vastgezette Gradle-versie, dus Android Studio koos zelf een (te nieuwe)
#versie. Dat gaf pas een probleem zodra de eerste externalNativeBuild/CMake
#-stap (CareSens Air-kalibratiebrug) werd toegevoegd: AGP 8.5.2's eigen
#CMake-integratiecode roept intern nog `Project.exec(Action)` aan — een
#methode die Gradle 9+ heeft verwijderd (vervangen door ExecOperations).
#Gevolg: "NoSuchMethodError" zodra Gradle probeert de C/C++-module te
#configureren, terwijl de rest van het project (geen native code) daar geen
#last van had. Fix: expliciet Gradle 8.7 vastzetten — de versie die AGP
#8.5.2's eigen releasenotes als minimum/aanbevolen opgeven, dus ruim voor de
#Gradle-9-verwijdering.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
